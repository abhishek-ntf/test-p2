<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070f" />
  <meta name="description" content="Neon Highway 3D - High-speed 2-player cyberpunk arcade racing on the endless 4-lane highway!" />
  <title>Neon Highway – 3D Cyber Racer</title>
  <!-- Playgama Bridge SDK -->
  <script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
  <script>
    // Initialize the Playgama Bridge SDK immediately as required by Playgama
    if (typeof window !== 'undefined' && typeof window.bridge !== 'undefined' && typeof window.bridge.initialize === 'function') {
      window.bridgeInitPromise = window.bridge.initialize()
        .then(function() {
          console.log('[Playgama] Bridge initialized successfully from index.html');
          return window.bridge;
        })
        .catch(function(error) {
          console.error('[Playgama] Bridge failed to initialize from index.html:', error);
          return null;
        });
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
